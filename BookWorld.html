<script>
let LetOut = false;

const audios = [
    "AUD/Wormwood/Knock1.mp3",
    "AUD/Wormwood/Knock2.mp3",
    "AUD/Wormwood/Knock3.mp3",
    "AUD/Wormwood/Knock4.mp3"
];

let audio = new Audio();
function PlayRandomAudio() {
    if (LetOut) return;
    let random = Math.floor(Math.random() * 4);
    audio.src = audios[random];
    audio.play();
    audio.onended = function() {
        PlayRandomAudio();
    };
}
PlayRandomAudio();
