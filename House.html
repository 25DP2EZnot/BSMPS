<script>
function anime(img) {
  if (!img) return;
  let anglePhase = Math.random() * Math.PI * 2;
  let opacityPhase = Math.random() * Math.PI * 2;
  const rotDuration = Math.random() * 4 + 1;
  const opDuration = Math.random() * 4 + 1;
  const rotSpeed = (Math.PI * 2) / (rotDuration * 60);
  const opSpeed = (Math.PI * 2) / (opDuration * 60);
  const maxAngle = Math.random() * 20 + 20;
  img.style.transformOrigin = 'center';
  function animate() {
    anglePhase += rotSpeed;
    opacityPhase += opSpeed;
    const currentAngle = Math.sin(anglePhase) * maxAngle;
    const currentOpacity = 0.6 + Math.cos(opacityPhase) * 0.4;
    img.style.transform = `rotate(${currentAngle}deg)`;
    img.style.opacity = currentOpacity;
    requestAnimationFrame(animate);
  }
  animate();
}
